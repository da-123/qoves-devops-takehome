apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: qoves
  source:
    repoURL: https://github.com/qoves-devops-takehome/qoves-devops-takehome.git
    targetRevision: main
    path: gitops/manifests/api
  destination:
    server: https://kubernetes.default.svc
    namespace: qoves-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:

    - group: apps
      kind: Deployment
      name: api
      jsonPointers:
        - /spec/replicas
