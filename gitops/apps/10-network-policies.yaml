apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: qoves
  source:
    repoURL: https://github.com/da-123/qoves-devops-takehome.git
    targetRevision: main
    path: gitops/manifests/network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: qoves-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
