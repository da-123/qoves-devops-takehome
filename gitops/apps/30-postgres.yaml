apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: qoves
  source:
    repoURL: https://github.com/qoves-devops-takehome/qoves-devops-takehome.git
    targetRevision: main
    path: gitops/manifests/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: qoves-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
