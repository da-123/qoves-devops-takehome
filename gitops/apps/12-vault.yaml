apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    # Before External Secrets, which is before anything that needs a credential.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: qoves
  source:
    repoURL: https://github.com/qoves-devops-takehome/qoves-devops-takehome.git
    targetRevision: main
    path: gitops/manifests/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
