apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    # Sync waves order the children: namespaces exist before anything lands in them.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: qoves
  source:
    repoURL: https://github.com/da-123/qoves-devops-takehome.git
    targetRevision: main
    path: gitops/manifests/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: qoves-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
