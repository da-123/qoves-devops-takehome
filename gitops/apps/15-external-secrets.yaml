apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: qoves
  source:
    # Upstream chart consumed directly - nothing vendored, nothing to drift.
    # Verify versions with: helm search repo external-secrets --versions
    # Chart repo, not the git repo - see the AppProject's sourceRepos allow-list.
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.4
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        # The webhook needs a cert; the chart's own cert-controller issues it,
        # which avoids a cert-manager dependency for this exercise.
        certController:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 192Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CRDs are large enough to blow the annotation-based apply limit.
      - ServerSideApply=true
