apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    # After Vault and the External Secrets controller (both wave 1), before
    # anything that consumes the Secret they produce.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: qoves
  source:
    repoURL: https://github.com/da-123/qoves-devops-takehome.git
    targetRevision: main
    path: gitops/manifests/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: qoves-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    # The controller writes refresh timestamps and conditions back onto the
    # ExternalSecret; without this the Application flaps OutOfSync every hour.
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
