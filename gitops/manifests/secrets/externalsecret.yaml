
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: qoves-app
spec:
  # Vault is the source of truth, so re-read it hourly. Rotation in Vault
  # propagates without a commit; the workloads still need a restart to pick up
  # new env vars, which is the honest limit of env-var-injected secrets.
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: postgres-credentials
    # Owner: External Secrets creates the Secret and owns its lifecycle, so
    # deleting this ExternalSecret garbage-collects the Secret with it.
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
       
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres.qoves-app.svc.cluster.local:5432/{{ .database }}?sslmode=disable"
  dataFrom:
    - extract:
      
        key: postgres
