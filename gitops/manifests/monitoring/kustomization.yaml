apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml=config/prometheus.yml
  - name: prometheus-rules
    namespace: monitoring
    files:
      - alerts.yml=config/alerts.yml
