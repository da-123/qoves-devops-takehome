apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: qoves-app
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: qoves-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
  
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # fsGroup is what makes the hostPath-backed PVC writable by uid 999.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
        
          image: postgres:16.4
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            # A mounted volume's root can contain lost+found, which initdb
            # refuses to use. Always give PGDATA its own subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # pg_isready is the only honest readiness signal: the process can be up
          # while recovery is still replaying.
          readinessProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              # SIGTERM to postgres is a *smart* shutdown: it waits for clients
              # to disconnect and can burn the whole grace period. Fast shutdown
              # rolls back open transactions and checkpoints immediately.
              exec:
                command:
                  ["sh", "-c", 'pg_ctl -D "$PGDATA" -m fast -w stop || true']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Left writable on purpose: the entrypoint writes postgresql.conf,
            # the unix socket dir and pid files outside PGDATA. Locking this down
            # means mounting three emptyDirs for no real gain at this scale.
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # ReadWriteOnce: one node at a time. See writeup section F.
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: use the cluster default. On minikube that is
        # `standard` (hostpath provisioner) - node-local, not replicated.
        resources:
          requests:
            storage: 1Gi
