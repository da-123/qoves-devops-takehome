apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: qoves-app
  labels:
    app: api
    app.kubernetes.io/name: qoves-api
    app.kubernetes.io/part-of: qoves-platform
spec:
  # No replicas field: the HPA owns it (see gitops/apps/40-api.yaml).
  selector:
    matchLabels:
      app: api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: qoves-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Two nodes, so spread the replicas. ScheduleAnyway rather than
      # DoNotSchedule: an unschedulable pod is worse than an unbalanced one.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      containers:
        - name: api
          # Pinned in kustomization.yaml (tag today, digest once pushed to GHCR).
          image: qoves-api:0.1.0
          # IfNotPresent so a locally built image loaded with `minikube image
          # load` is used instead of being pulled from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Liveness deliberately hits `/`, which has no dependencies. If it hit
          # /healthz, a database blip would restart every API pod and turn a
          # dependency outage into a crash loop.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          # Readiness hits /healthz on purpose: every real request needs the DB,
          # so a pod that cannot reach Postgres should leave the Service
          # endpoints. It also gives the /healthz counter a steady heartbeat,
          # which is what the Prometheus alert watches.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
